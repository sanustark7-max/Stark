name: Vikrant Traffmonetizer Final

on:
  workflow_dispatch:

jobs:
  run-tm:
    runs-on: ubuntu-latest
    steps:
      - name: Setup & Run
        run: |
          TOKEN="cR/xpR+WnmdgJlvsQYaVPAGs4fzW6MGLv+FcvXM4WYg="
          
          # Official Linux binary download
          wget https://get.traffmonetizer.com/linux/amd64/traffmonetizer -O tm
          
          # Permission set karna zaroori hai
          chmod +x ./tm
          
          echo "[+] Starting engine..."
          # Background me chalane ke liye
          ./tm start accept --token $TOKEN &
          
          # GitHub action ko active rakhne ke liye sleep
          sleep 21600
