name: Vikrant Traffmonetizer Runner

on:
  workflow_dispatch:

jobs:
  run-tm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Launch Traffmonetizer
      run: |
        # Token set kar diya hai
        TOKEN="cR/xpR+WnmdgJlvsQYaVPAGs4fzW6MGLv+FcvXM4WYg="
        
        echo "[*] Starting Traffmonetizer..."
        curl -L https://github.com/traffmonetizer/cli/releases/latest/download/traffmonetizer-cli-linux-amd64 -o tm
        chmod +x tm
        
        # Background process
        nohup ./tm start accept --token $TOKEN > tm.log 2>&1 &
        
        echo "[+] Traffmonetizer is RUNNING!"
        sleep 10
        cat tm.log
        
        # Session zinda rakhne ke liye sleep
        sleep 21600
