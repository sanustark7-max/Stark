name: Vikrant Headless Traffic Runner

on:
  workflow_dispatch:

jobs:
  run-traffic:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb cpulimit wget unzip bzip2 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64

    - name: Download & Setup 9Hits CLI
      run: |
        # .com wale main domain ka link aur timeout bypass lagaya hai
        wget -q --tries=5 --timeout=20 https://9hits.com/download/v2/9hits-cli-linux-x64.tar.bz2
        tar -xf 9hits-cli-linux-x64.tar.bz2
        cd 9hits-cli
        
        # Vikrant Bhai ka token
        echo "46916090abb01c3682cd238efd169055" > token.txt
        
        echo '{"web": {"max_slots": 3, "cpu_limit": 85}}' > config.json

    - name: Run Headless 9Hits
      run: |
        cd 9hits-cli
        
        # Virtual screen start
        Xvfb :99 -screen 0 1024x768x16 &
        export DISPLAY=:99
        
        echo "[+] Starting 9Hits Client with 85% CPU Cap..."
        
        # CPU limit background execution
        sudo cpulimit --exe=9hits-app --limit=85 --background
        
        # Tool execution start
        ./9hits-app --start
