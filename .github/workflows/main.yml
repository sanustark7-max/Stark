name: Vikrant Traffmonetizer Runner

on:
  workflow_dispatch:

jobs:
  run-tm:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install & Launch Traffmonetizer
      run: |
        # Official NPM package se direct install ho raha hai
        npm install -g traffmonetizer
        
        # Token
        TOKEN="cR/xpR+WnmdgJlvsQYaVPAGs4fzW6MGLv+FcvXM4WYg="
        
        echo "[+] Starting Traffmonetizer via NPM..."
        traffmonetizer start accept --token $TOKEN
        
        # Session zinda rakhne ke liye
        sleep 21600
