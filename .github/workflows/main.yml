name: Vikrant Traffmonetizer Runner

on:
  workflow_dispatch:

jobs:
  run-tm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Launch Traffmonetizer
      run: |
        TOKEN="cR/xpR+WnmdgJlvsQYaVPAGs4fzW6MGLv+FcvXM4WYg="
        
        echo "[*] Downloading Traffmonetizer..."
        # -L follow redirect, -s silent, -o output
        curl -sL https://github.com/traffmonetizer/cli/releases/latest/download/traffmonetizer-cli-linux-amd64 -o tm
        
        # Binary execution fix: ensure file is executable
        chmod +x ./tm
        
        echo "[+] Starting Traffmonetizer..."
        # Direct execution without nohup for debugging to see if it starts
        ./tm start accept --token $TOKEN
        
        # Agar error aaye toh status check
        sleep 10
