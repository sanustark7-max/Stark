name: Vikrant Headless Traffic Runner

on:
  workflow_dispatch:

jobs:
  run-traffic:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Tools & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb cpulimit wget unzip libgconf-2-4 libnss3 bzip2

    - name: Download & Setup 9Hits CLI
      run: |
        wget -q https://9hits.to/download/v2/9hits-cli-linux-x64.tar.bz2
        tar -xf 9hits-cli-linux-x64.tar.bz2
        cd 9hits-cli
        
        # Vikrant Bhai ka token automatic set
        echo "46916090abb01c3682cd238efd169055" > token.txt
        
        echo '{"web": {"max_slots": 3, "cpu_limit": 85}}' > config.json

    - name: Run 9Hits under Virtual Screen with 85% CPU Limit
      run: |
        cd 9hits-cli
        
        # Virtual screen start
        Xvfb :99 -screen 0 1024x768x16 &
        export DISPLAY=:99
        
        echo "[+] Starting 9Hits Client with 85% CPU Cap..."
        
        # CPU limit trigger
        sudo cpulimit --exe=9hits-app --limit=85 --background
        
        # Main app start
        ./9hits-app --start
